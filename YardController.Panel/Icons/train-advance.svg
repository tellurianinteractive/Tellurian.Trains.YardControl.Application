<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <title>Train advance</title>
  <!-- One step of the lifecycle: the number moves on past the signal. Which step that turns out to be - arrived, departed, or gone from the station - is deduced from where the number is standing, so the key says only 'onwards'. -->
